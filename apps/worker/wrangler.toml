# deepSea Worker —— GitHub OAuth + 静态资源托管
# 部署：wrangler deploy（静态资源直接取 ../web/dist 作为 ASSETS）
name = "deepsea"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# nodejs_compat：crypto.ts 的 toBase64/fromBase64 用了 btoa()/atob()，
# 生产 Workers 无此 flag 时二者为 undefined → 登录/token 解密抛 1101。
compatibility_flags = ["nodejs_compat"]

# ── 关闭 workers.dev（仅用自定义域名 deepc.cn，双入口易混淆） ─────────────
workers_dev = false

# ── 自定义域名：deepc.cn（Cloudflare 自动创建 DNS 记录与证书） ────────────
# 前提：deepc.cn 的 zone 已托管在同一 Cloudflare 账户
[[routes]]
pattern = "deepc.cn"
custom_domain = true

# ── 静态资源：web 构建产物直接作为 worker 资产 ─────────────────────────────
# 构建顺序：先 pnpm --filter @deepsea/web build，再 wrangler deploy
[assets]
directory = "../web/dist"
binding = "ASSETS"
# SPA 路由回退：/plugins、/plugin/... 等前端路由返回 index.html
not_found_handling = "single-page-application"
# 选择性 Worker-first（官方支持）：只让 /auth/* 这 4 个路由先进 Worker。
# 其余请求保持默认 asset-first——静态资源（JS/CSS/字体/图片）由 Assets 直接
# 服务、SPA 回退由 Assets 免费处理，全程零 Worker 计算额度。
# 若不配置此项，浏览器导航（Sec-Fetch-Mode: navigate）到 /auth/callback
# 会被 Assets 按 SPA 回退直接返回 index.html，OAuth 回调到不了 Worker。
run_worker_first = [
  "/auth/login",
  "/auth/callback",
  "/auth/me",
  "/auth/logout",
  "/auth/preferences",
  "/auth/interconnect-log",
  "/auth/signal/put",
  "/auth/signal/get",
]

# ── KV：state（防 CSRF）/ 临时口令信令（signal）/ 限流计数 ──────────────────
# 创建：wrangler kv namespace create DEEPSEA_KV，然后把 id 填到下面
# 用户/会话/profile 已迁 D1（见 [[d1_databases]]），KV 不再存 user/session。
[[kv_namespaces]]
binding = "DEEPSEA_KV"
id = "a282b972ccde4838ac2bb101f5fb6e72"

# ── D1：用户 / 会话 / profile（关系型，支撑多端会话 + 审计 + profile 页）────
# 上线前：wrangler d1 create deepsea 拿到真实 database_id 替换占位 UUID。
# 本地开发：wrangler d1 migrations apply deepsea --local 应用迁移。
[[d1_databases]]
binding = "DEEPSEA_D1"
database_name = "deepsea"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ── 变量（公开配置，随代码部署）────────────────────────────────────────────
[vars]
# 站点基址：授权 callback 为 {DEEPSEA_BASE}/auth/callback
DEEPSEA_BASE = "https://deepc.cn"
# GitHub OAuth 授权端点 / scope
GITHUB_OAUTH_AUTHORIZE = "https://github.com/login/oauth/authorize"
# OAuth scope：read:user（用户资料）+ public_repo（公开仓库写 discussions）
GITHUB_OAUTH_SCOPE = "read:user public_repo"
# 会话 / state 有效期（秒）
SESSION_TTL_SECONDS = "2592000"
STATE_TTL_SECONDS = "420"

# ── 以下请单独设置不提交，wrangler secret put <some_key> <some_secret> ────
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# TOKEN_ENC_KEY
