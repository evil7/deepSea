# ---------------------------------------------------------------------------
# 插件种子数据自动同步
#   定期运行 scripts/search-deepseek-repos.mjs 收录 deepseek-harness 生态仓库，
#   将最新结果提交到 apps/web/public/data/deepseek-harness-repos.json（前端种子）
#   与 scripts/output/deepseek-harness-repos.json（脚本输出留档）。
#
# 同步周期：每小时一次（cron "23 * * * *"，每小时的第 23 分钟 UTC 触发）
#   选择理由：
#     · star 数 / 新仓库 / 推送动态为小时级变化，每小时同步保持最及时
#     · 单次运行 ~3 分钟（关键词 OR 合并 + 11 topic，per_page=100 分页，
#       2.1s 节流），24 次/天 ≈ 72 分钟/天，仍远低于免费额度 2000 分钟/月
#     · 分钟数固定 23 分，避免与其它仓库的整点 cron 抢资源
#   GitHub Search API 限额：带 token 30 req/min；脚本 OR 合并后单次请求量
#   大幅下降（9 关键词 → 2 组 OR + 11 topic），配额见底自动停止保底。
# ---------------------------------------------------------------------------
name: Sync Plugin Seed Data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {} # 手动触发（Actions 页面 "Run workflow"）

# 允许将种子数据提交回仓库
permissions:
  contents: write

concurrency:
  group: sync-plugin-seed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行插件收录脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 默认参数：limit 500/类型、star ≥ 10、创建距今 ≥ 5 天（缓存质量门槛），
        # 6 核心关键词 1 组 OR + 11 topic，自动分页递归 + 配额见底兜底
        run: pnpm search:plugins

      - name: 提交种子数据更新（无变更则跳过）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/deepseek-harness-repos.json \
                  scripts/output/deepseek-harness-repos.json
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore(data): 同步插件种子数据 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "已提交并推送种子数据更新"
          fi
